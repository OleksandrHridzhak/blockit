name: ios-build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'spec/**']
  pull_request:
    paths-ignore: ['**.md', 'spec/**']
  workflow_dispatch:
    inputs:
      testflight:
        description: Build a signed App Store IPA
        type: boolean
        default: false
      build_number:
        description: Unused App Store build number
        type: string
        default: '20'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.testflight
    name: ${{ matrix.variant }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Dev client: loads JS from Metro running on Windows (same Wi-Fi). Install via Sideloadly.
          - variant: device-debug
            configuration: Debug
            sdk: iphoneos
            destination: generic/platform=iOS
          # Standalone build with embedded JS bundle. Install via Sideloadly.
          - variant: device-release
            configuration: Release
            sdk: iphoneos
            destination: generic/platform=iOS
          # Simulator build: smoke-run + screenshots (later: Maestro E2E).
          - variant: simulator
            configuration: Release
            sdk: iphonesimulator
            destination: generic/platform=iOS Simulator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Xcode info
        run: xcodebuild -version && xcrun simctl list runtimes

      - run: npm ci

      - name: Expo prebuild (generate ios/)
        run: npx expo prebuild -p ios --clean --no-install

      - uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json', 'plugins/**', 'modules/**') }}

      - name: Pod install
        run: cd ios && pod install

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace ios/Blockit.xcworkspace \
            -scheme Blockit \
            -configuration ${{ matrix.configuration }} \
            -sdk ${{ matrix.sdk }} \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | xcbeautify --renderer github-actions

      - name: Locate .app and verify Screen Time extensions
        id: app
        run: |
          APP="build/Build/Products/${{ matrix.configuration }}-${{ matrix.sdk }}/Blockit.app"
          test -d "$APP"
          test -d "$APP/PlugIns/BlockitShield.appex"
          test -d "$APP/PlugIns/BlockitAction.appex"
          test -d "$APP/PlugIns/BlockitMonitor.appex"
          echo "path=$APP" >> "$GITHUB_OUTPUT"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$APP/Info.plist"

      - name: Package unsigned IPA
        if: matrix.sdk == 'iphoneos'
        run: |
          mkdir -p out/Payload
          cp -R "${{ steps.app.outputs.path }}" out/Payload/
          cd out && zip -qry "Blockit-${{ matrix.variant }}-unsigned.ipa" Payload

      - name: Simulator smoke run
        if: matrix.sdk == 'iphonesimulator'
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -E '^\s+iPhone' | grep -oE '[0-9A-F-]{36}')
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "${{ steps.app.outputs.path }}"
          mkdir -p out
          xcrun simctl launch "$UDID" com.hridzhak.blockit.2WT689Y795
          sleep 20
          xcrun simctl io "$UDID" screenshot out/01-launch.png
          xcrun simctl openurl "$UDID" "blockit://intervene?preview=1"
          sleep 8
          xcrun simctl io "$UDID" screenshot out/02-deeplink.png

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockit-${{ matrix.variant }}
          path: |
            out/
            build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish latest IPA to GitHub Release (fixed URL for Sideloadly)
        if: success() && github.ref == 'refs/heads/main' && matrix.sdk == 'iphoneos'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA_FILE="out/Blockit-${{ matrix.variant }}-unsigned.ipa"
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest Blockit iOS Builds" --notes "Automatically updated unsigned IPAs from main. Fixed URLs for Sideloadly."
          gh release upload latest "$IPA_FILE" --clobber

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Select newest installed stable Xcode
        run: |
          python3 - <<'PY'
          import glob, re, subprocess
          paths = [p for p in glob.glob('/Applications/Xcode_*.app') if re.search(r'Xcode_[0-9.]+\.app$', p)]
          if paths:
              chosen = max(paths, key=lambda p: tuple(map(int, re.search(r'Xcode_([0-9.]+)', p)[1].split('.'))))
              subprocess.run(['sudo', 'xcode-select', '-s', chosen + '/Contents/Developer'], check=True)
          PY
          xcodebuild -version
      - run: npm ci
      - name: Validate JavaScript and native timing
        run: |
          npx tsc --noEmit
          npx expo lint
          node scripts/test-native-window.cjs
          node scripts/check-screen-time.cjs
      - name: Set build number and generate iOS project
        env:
          BLOCKIT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('app.json'));if(!/^[1-9][0-9]*$/.test(process.env.BLOCKIT_BUILD_NUMBER))throw Error('Invalid build number');c.expo.ios.buildNumber=process.env.BLOCKIT_BUILD_NUMBER;fs.writeFileSync('app.json',JSON.stringify(c,null,2))"
          npx expo prebuild --platform ios --clean --no-install
          cd ios && pod install
      - name: Install existing Blockit signing profiles
        env:
          BLOCKIT_IOS_SIGNING: ${{ secrets.BLOCKIT_IOS_SIGNING }}
        run: |
          python3 scripts/github-ios-signing.py
          node scripts/github-ios-configure.cjs
      - name: Archive signed application
        run: |
          set -o pipefail
          xcodebuild archive -workspace ios/Blockit.xcworkspace -scheme Blockit -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Blockit.xcarchive" | tee "$RUNNER_TEMP/blockit-archive.log" | xcbeautify --renderer github-actions
      - name: Export App Store IPA
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Blockit.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/blockit-signing/ExportOptions.plist" -exportPath "$RUNNER_TEMP/blockit-export"
          test -f "$RUNNER_TEMP/blockit-export/Blockit.ipa"
      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: blockit-testflight-${{ inputs.build_number }}
          path: ${{ runner.temp }}/blockit-export/Blockit.ipa
          retention-days: 1
          if-no-files-found: error
      - name: Remove temporary signing keychain
        if: always()
        run: python3 scripts/github-ios-signing.py cleanup
